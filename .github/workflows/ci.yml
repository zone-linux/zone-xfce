name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  config:
    name: Validate the Zone XFCE configuration
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install tooling
        run: pacman -Syu --noconfirm --needed bash zsh shellcheck

      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          bash -n scripts/Player scripts/zonky scripts/neofetch \
                  scripts/xfce4-session-logout scripts/qbittorrent bin/startupsound
          zsh -n src/.zshrc

      - name: shellcheck
        run: shellcheck -S warning scripts/Player scripts/zonky scripts/xfce4-session-logout scripts/qbittorrent bin/startupsound

      - name: Theme alignment
        run: |
          config=src/.config/xfce4/xfconf/xfce-perchannel-xml
          grep -q 'name="ThemeName".*value="Qogir-Dark"' "$config/xsettings.xml"
          grep -q 'name="IconThemeName".*value="Qogir-Dark"' "$config/xsettings.xml"
          grep -q 'name="theme".*value="Qogir-Dark"' "$config/xfwm4.xml"
          grep -q 'name="theme".*value="Default"' "$config/xfce4-notifyd.xml"
          grep -qx 'theme=Qogir-dark' src/.config/Kvantum/kvantum.kvconfig
          test ! -e 'src/.config/Kvantum/Qogir-dark#'

      - name: Session autostart
        run: |
          test ! -e src/.config/autostart/killMPD.desktop
          test ! -e src/.config/autostart/killConky.desktop
          test ! -e src/.config/autostart/LogoutSound.desktop
          test -L src/.config/systemd/user/default.target.wants/mpd.service

      - name: Desktop entries
        run: |
          status=0
          while IFS= read -r file; do
            grep -q '^\[Desktop Entry\]' "$file" || { echo "$file: missing [Desktop Entry]" >&2; status=1; }
            grep -q '^Exec=' "$file" || { echo "$file: missing Exec" >&2; status=1; }
          done < <(find src/.config/autostart -name '*.desktop' | sort)
          exit "$status"

      - name: Alias sanity
        run: |
          # Every alias must have a command and must not point at removed tools.
          if grep -nE '^alias [^=]+=(exa|blueberry|gnu-netcat|gtop)\b' src/.zshrc src/.zshrc-personal; then
            echo "an alias still points at a removed tool" >&2
            exit 1
          fi
          if ! grep -q '^alias cleanup=' src/.zshrc-personal; then
            echo "src/.zshrc-personal is missing the cleanup alias" >&2
            exit 1
          fi
